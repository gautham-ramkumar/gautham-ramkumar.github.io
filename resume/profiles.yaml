# ============================================================
# profiles.yaml — one entry per targeted resume.
#
# Every profile renders the same layout (resume/template.tex.j2) over the
# same facts (resume/content.yaml); only the project selection, ordering,
# and skill rows change. Add a profile here to get a new PDF, and
# build.py regenerates the site's picker (js/resumes.js) to match.
#
#   projects:      explicit, ordered list of project ids. Order = page order.
#   skills:        ordered list of skill-row keys from content.yaml.
#   max_projects:  hard cap applied after ordering.
#   max_bullets:   bullets kept per project.
#   label/blurb:   shown in the website's resume dropdown.
#
# max_projects and max_bullets are the two dials for holding one page.
# ============================================================

# Which profile is also copied to the legacy Gautham_Ramkumar_Resume.pdf
# filename that the site header has linked to since launch.
default: slam

profiles:

  # ----------------------------------------------------------
  slam:
    label: Robotics & SLAM
    blurb: Localization, calibration, and state estimation
    filename: Gautham_Ramkumar_Resume_SLAM.pdf
    projects: [rtab, ekf, cam_lidar, yeschef, vio]
    max_projects: 5
    max_bullets: 3
    skills: [languages, autonomy, perception, hardware, practices]

  # ----------------------------------------------------------
  computer-vision:
    label: Computer Vision
    blurb: 3D perception, multi-view geometry, learned enhancement
    filename: Gautham_Ramkumar_Resume_Computer_Vision.pdf
    projects: [gsplat, darksight, sfm, cam_lidar, color]
    max_projects: 4
    max_bullets: 2
    skills: [languages, vision3d, perception, learning, practices]

  # ----------------------------------------------------------
  deep-learning:
    label: Deep Learning & Edge ML
    blurb: Model design and real-time inference on edge hardware
    filename: Gautham_Ramkumar_Resume_Deep_Learning.pdf
    projects: [darksight, yeschef, gsplat, lowlight, wall]
    max_projects: 4
    max_bullets: 2
    skills: [languages, learning, vision3d, hardware, practices]

  # ----------------------------------------------------------
  control:
    label: Control & Manipulation
    blurb: Gait synthesis, feedback control, and manipulation
    filename: Gautham_Ramkumar_Resume_Control_Manipulation.pdf
    projects: [yeschef, hzd, rtab, cam_lidar, vio]
    max_projects: 4
    max_bullets: 3
    skills: [languages, control, autonomy, hardware, practices]
